# Secret created by the operator before install. Keys are listed in the README.
credentialsSecret: store-credentials

store:
  # Public storefront URL. Used as the WordPress home and site URL, for the Ingress host,
  # and as the URL woo-mcp signs REST requests against.
  url: http://store.localtest.me
  title: Urumi Store
  adminUser: admin
  adminEmail: admin@example.com
  timezone: Asia/Kolkata
  currency: INR
  country: IN

woocommerceVersion: 11.2.1

images:
  wordpress: wordpress:7.1.3-php8.4-apache
  wpCli: wordpress:cli-2.12.0-php8.4
  mariadb: mariadb:11.8.9-noble
  wooMcp: urumi/woo-mcp:0.1.0

ingress:
  className: traefik

storage:
  className: local-path
  mariadbSize: 2Gi
  wpContentSize: 2Gi

resources:
  mariadb:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }
  wordpress:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  setup:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  wooMcp:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
