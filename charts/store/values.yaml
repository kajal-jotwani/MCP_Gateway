# Secret created by the operator before install. Keys are listed in the README.
credentialsSecret: store-credentials

store:
  # Public storefront URL. Used as the WordPress home and site URL, for the Ingress host,
  # and as the URL woo-mcp signs REST requests against.
  url: http://store.localtest.me
  title: Urumi Store
  adminUser: admin
  adminEmail: admin@example.com
  timezone: Asia/Kolkata
  currency: INR
  country: IN

woocommerceVersion: 11.2.1

images:
  wordpress: wordpress:7.1.3-php8.4-apache
  wpCli: wordpress:cli-2.12.0-php8.4
  mariadb: mariadb:11.8.9-noble
  wooMcp: urumi/woo-mcp:0.1.0

ingress:
  className: traefik
  # Where the controller's pods run. The NetworkPolicies let only this namespace reach WordPress.
  controllerNamespace: kube-system

# The namespace the gateway chart is installed in. Only its gateway pods may call woo-mcp.
gatewayNamespace: gateway

storage:
  className: local-path
  mariadbSize: 2Gi
  wpContentSize: 2Gi

resources:
  mariadb:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: '1', memory: 768Mi }
  wordpress:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: '1', memory: 512Mi }
  setup:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: '1', memory: 512Mi }
  wooMcp:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# Caps for the whole namespace, so one store cannot starve the others on a shared node. They cover
# every pod above at once plus a second woo-mcp pod during a rolling update.
quota:
  requests: { cpu: '1', memory: 1536Mi, storage: 6Gi }
  limits: { cpu: '5', memory: 3Gi }
  pods: 8
  persistentVolumeClaims: 3

# Applied to any container that sets no requests or limits of its own, and the most one may ask for.
limitRange:
  defaultRequest: { cpu: 50m, memory: 64Mi }
  default: { cpu: 250m, memory: 256Mi }
  max: { cpu: '1', memory: 1Gi }
