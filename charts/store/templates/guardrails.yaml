apiVersion: v1
kind: ResourceQuota
metadata:
  name: store
  labels:
    {{- include "store.labels" (dict "root" $ "name" "store") | nindent 4 }}
spec:
  hard:
    requests.cpu: {{ .Values.quota.requests.cpu | quote }}
    requests.memory: {{ .Values.quota.requests.memory | quote }}
    requests.storage: {{ .Values.quota.requests.storage | quote }}
    limits.cpu: {{ .Values.quota.limits.cpu | quote }}
    limits.memory: {{ .Values.quota.limits.memory | quote }}
    pods: {{ .Values.quota.pods | quote }}
    persistentvolumeclaims: {{ .Values.quota.persistentVolumeClaims | quote }}
    # A store is reached through the shared Ingress controller only.
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: store
  labels:
    {{- include "store.labels" (dict "root" $ "name" "store") | nindent 4 }}
spec:
  limits:
    - type: Container
      defaultRequest:
        {{- toYaml .Values.limitRange.defaultRequest | nindent 8 }}
      default:
        {{- toYaml .Values.limitRange.default | nindent 8 }}
      max:
        {{- toYaml .Values.limitRange.max | nindent 8 }}
