# Secrets created by the operator before install. Keys are listed in the README.
secrets:
  # POSTGRES_PASSWORD, BOOTSTRAP_ADMIN_EMAIL, BOOTSTRAP_ADMIN_PASSWORD, UPSTREAM_CREDENTIAL_KEY
  gateway: gateway-credentials
  # NOTES_TOKEN, the bearer token notes-mcp requires. Admins enter the same value in the dashboard.
  notes: notes-credentials
  # ANTHROPIC_API_KEY, the chat agent's key for the Claude API.
  llm: llm-credentials

# Where people reach the dashboard and the MCP endpoint. Also the Ingress host and the base of
# invite links.
publicUrl: http://app.localtest.me

# Registered on the gateway's first start only. Admins can edit or remove it afterwards.
seedUpstream:
  name: WooCommerce
  slug: woocommerce
  url: http://woo-mcp.store.svc.cluster.local:3000/mcp

gateway:
  # Gateway pods behind the Service. Any number works; see "Scaling" in docs/design.md.
  replicas: 2
  # Tool calls each member may make per minute, counted across all replicas, from MCP clients and the
  # chat agent together. 0 turns the limit off.
  toolCallsPerMinute: 120

# Stores members create from the dashboard. The provisioner installs ../store into a namespace
# store-<slug> per store and registers its woo-mcp as an upstream.
stores:
  # Each store is served at store-<slug>.<domain>. *.localtest.me resolves to 127.0.0.1.
  domain: localtest.me
  maxPerMember: 3
  provisionTimeoutMinutes: 15
  # Store chart values shared by every provisioned store, such as the woo-mcp image. Each store's URL,
  # title and the gateway namespace are set by the provisioner.
  chartValues: {}

images:
  # The gateway image also runs the provisioner, with helm and the store chart inside.
  gateway: urumi/gateway:0.2.0
  postgres: postgres:18.6-alpine3.24
  notesMcp: urumi/notes-mcp:0.1.0
  everything: urumi/everything:2.0.0

ingress:
  className: traefik
  # Where the controller's pods run. The NetworkPolicies let only this namespace reach the gateway.
  controllerNamespace: kube-system

upstreamNetwork:
  # Host names an upstream URL may use although they resolve to a private or cluster-internal
  # address, such as my-mcp.tools.svc.cluster.local. A * matches part of one label. The seeded store,
  # notes-mcp, everything, provisioned stores and hosted servers are always allowed. Loopback,
  # link-local and cloud metadata addresses are refused for every host.
  internalHosts: []

metrics:
  # A namespace whose pods may scrape the gateway's Prometheus metrics on port 9464, such as
  # monitoring. Empty: only `kubectl port-forward` reaches them.
  scrapeNamespace: ''

storage:
  className: local-path
  postgresSize: 1Gi

resources:
  gateway:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: '1', memory: 512Mi }
  provisioner:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: '1', memory: 384Mi }
  postgres:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: '1', memory: 512Mi }
  notesMcp:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 250m, memory: 192Mi }
  everything:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { cpu: 250m, memory: 256Mi }
