# Every pod in the namespace refuses incoming traffic unless a policy below allows it. Egress is
# not restricted: the gateway calls upstreams that admins add anywhere, and the Claude API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "gateway.labels" (dict "root" $ "name" "default-deny-ingress") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# Browsers and MCP clients reach the gateway only through the Ingress controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
  labels:
    {{- include "gateway.labels" (dict "root" $ "name" "gateway") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gateway.selectorLabels" (dict "root" $ "name" "gateway") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace }}
      ports:
        - port: http
    {{- with .Values.metrics.scrapeNamespace }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - port: metrics
    {{- end }}
---
# The database answers the gateway and the provisioner only, and the bundled upstreams the gateway
# only, so nothing in the cluster can reach them around the gateway's API-key checks and audit.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  labels:
    {{- include "gateway.labels" (dict "root" $ "name" "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gateway.selectorLabels" (dict "root" $ "name" "postgres") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "gateway.selectorLabels" (dict "root" $ "name" "gateway") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "gateway.selectorLabels" (dict "root" $ "name" "provisioner") | nindent 14 }}
      ports:
        - port: postgres
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: upstreams
  labels:
    {{- include "gateway.labels" (dict "root" $ "name" "upstreams") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["notes-mcp", "everything"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "gateway.selectorLabels" (dict "root" $ "name" "gateway") | nindent 14 }}
      ports:
        - port: mcp
